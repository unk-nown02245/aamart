name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Aamart health endpoint
        run: |
          for attempt in 1 2 3; do
            echo "Ping attempt ${attempt}"
            if curl -fsS --max-time 90 https://aamart-7awh.onrender.com/api/health; then
              echo
              echo "Aamart is awake."
              exit 0
            fi
            sleep 15
          done
          echo "Aamart did not respond after 3 attempts."
          exit 1
