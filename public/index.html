<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a56db">
  <meta name="description" content="Aamart - Shop smart, live better. Electronics, fashion, home essentials and more at the best prices.">
  <meta property="og:title" content="Aamart - Online Shopping">
  <meta property="og:description" content="Electronics, fashion, home essentials and more at honest prices.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Aamart">
  <meta name="twitter:card" content="summary">
  <title>Aamart - Online Shopping</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-main">
        <a class="brand" href="#/" aria-label="Aamart home">
          <span class="brand-mark">A</span>
          <span class="brand-text">aamart<small>shop smart</small></span>
        </a>
      </div>

      <form class="search" id="search-form" role="search" autocomplete="off">
        <div class="search-field" id="search-field">
          <input id="search-input" class="search-input" type="search" name="q" placeholder="Search Aamart" aria-label="Search Aamart">
          <button type="button" class="search-clear hidden" id="search-clear" aria-label="Clear search" title="Clear search">&times;</button>
        </div>
        <button type="submit" class="search-btn" aria-label="Search">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false">
            <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"></circle>
            <path d="M20 20l-4-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </button>
        <div id="suggestions" class="suggestions hidden" role="listbox"></div>
      </form>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <strong>Aamart</strong>
        <p>Shop smart, live better. Everyday essentials at honest prices.</p>
      </div>
      <nav class="footer-links" aria-label="Footer">
        <a href="#/privacy">Privacy policy</a>
        <a href="#/terms">Terms of service</a>
        <a href="#/returns">Returns &amp; refunds</a>
        <a href="#/contact">Contact us</a>
      </nav>
    </div>
    <div class="footer-bottom">&copy; <span id="footer-year"></span> Aamart. All rights reserved.</div>
  </footer>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="#/" data-nav="home" class="nav-item">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 10.5 12 3.5l8.5 7"></path><path d="M5.5 9.5v10h13v-10"></path><path d="M9.5 19.5v-5h5v5"></path></svg>
      </span>
      <span data-i18n="home">Home</span>
    </a>
    <a href="#/categories" data-nav="categories" class="nav-item">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="7" height="7" rx="1.6"></rect><rect x="13.5" y="3.5" width="7" height="7" rx="1.6"></rect><rect x="3.5" y="13.5" width="7" height="7" rx="1.6"></rect><rect x="13.5" y="13.5" width="7" height="7" rx="1.6"></rect></svg>
      </span>
      <span data-i18n="categories">Categories</span>
    </a>
    <a href="#/cart" data-nav="cart" class="nav-item">
      <span class="nav-icon nav-icon-badge" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.5h2l2.2 10.2h9.8l2-7.2H6.2"></path><circle cx="9.2" cy="19" r="1.3"></circle><circle cx="17.2" cy="19" r="1.3"></circle></svg>
        <span class="nav-badge" id="nav-cart-badge" hidden>0</span>
      </span>
      <span data-i18n="cart">Cart</span>
    </a>
    <a href="#/orders" data-nav="orders" class="nav-item">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7.5 12 3.5l8 4v9l-8 4-8-4z"></path><path d="M4 7.5 12 11.5l8-4"></path><path d="M12 11.5v9"></path></svg>
      </span>
      <span data-i18n="orders">Orders</span>
    </a>
    <a href="#/account" data-nav="account" class="nav-item">
      <span class="nav-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20c.6-3.5 3.2-5.5 7-5.5s6.4 2 7 5.5"></path></svg>
      </span>
      <span data-i18n="account">Account</span>
    </a>
  </nav>

  <div id="toast-wrap" class="toast-wrap" aria-live="assertive"></div>
  <div id="modal-root"></div>

  <script src="/app.js"></script>
</body>
</html>
