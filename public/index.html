<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1a56db">
  <meta name="description" content="Aamart - Shop smart, live better. Electronics, fashion, home essentials and more at the best prices.">
  <title>Aamart - Online Shopping</title>
  <link rel="icon" href="/img/placeholder.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="#/" aria-label="Aamart home">
        <span class="brand-mark">A</span>
        <span class="brand-text">aamart<small>shop smart</small></span>
      </a>

      <form class="search" id="search-form" role="search" autocomplete="off">
        <span class="search-icon" aria-hidden="true">&#128269;</span>
        <input id="search-input" type="search" name="q" placeholder="Search for products, brands and more" aria-label="Search products">
        <button type="submit" class="search-btn">Search</button>
        <div id="suggestions" class="suggestions hidden" role="listbox"></div>
      </form>

      <div class="top-actions">
        <button class="icon-btn lang-btn" id="lang-toggle" title="Change language" aria-label="Change language">EN</button>
        <a class="icon-btn with-label" href="#/account" id="account-link">
          <span aria-hidden="true">&#128100;</span><span class="label">Account</span>
        </a>
        <a class="icon-btn with-label cart-link" href="#/cart" aria-label="Cart">
          <span aria-hidden="true">&#128722;</span><span class="label">Cart</span>
          <span class="badge" id="cart-badge" hidden>0</span>
        </a>
      </div>
    </div>
  </header>

  <main id="app" class="app" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="#/" data-nav="home" class="nav-item"><span class="nav-icon">&#127968;</span><span data-i18n="home">Home</span></a>
    <a href="#/categories" data-nav="categories" class="nav-item"><span class="nav-icon">&#128218;</span><span data-i18n="categories">Categories</span></a>
    <a href="#/cart" data-nav="cart" class="nav-item"><span class="nav-icon">&#128722;</span><span data-i18n="cart">Cart</span></a>
    <a href="#/orders" data-nav="orders" class="nav-item"><span class="nav-icon">&#128230;</span><span data-i18n="orders">Orders</span></a>
    <a href="#/account" data-nav="account" class="nav-item"><span class="nav-icon">&#128100;</span><span data-i18n="account">Account</span></a>
  </nav>

  <div id="toast-wrap" class="toast-wrap" aria-live="assertive"></div>
  <div id="modal-root"></div>

  <script src="/app.js"></script>
</body>
</html>
