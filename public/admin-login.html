<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1a56db">
  <title>Admin Login - Aamart</title>
  <script src="/theme.js?v=__ASSET_VERSION__"></script>
  <link rel="stylesheet" href="/splash.css?v=__ASSET_VERSION__">
  <link rel="stylesheet" href="/admin.css?v=__ASSET_VERSION__">
</head>
<body class="login-page">
  <div class="site-splash" id="site-splash" role="status" aria-label="Loading Aamart">
    <div class="site-splash__aura" aria-hidden="true"></div>
    <div class="site-splash__content">
      <div class="site-splash__logo" aria-hidden="true">A</div>
      <div class="site-splash__word" aria-hidden="true"><span>A</span><span>a</span><span>m</span><span>a</span><span>r</span><span>t</span></div>
      <div class="site-splash__track" aria-hidden="true"><span></span></div>
      <p class="site-splash__tag">Shop smart. Live better.</p>
    </div>
  </div>

  <main class="login-wrap">
    <section class="login-card">
      <div class="login-logo" aria-hidden="true">A</div>
      <h1 class="login-title">Aamart <span>Admin</span></h1>
      <p class="login-sub">Sign in to manage your store</p>

      <form id="login-form" novalidate>
        <label class="field">
          <span>Username</span>
          <input name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <div class="login-error" id="login-error" role="alert" hidden></div>
        <button class="btn primary block" type="submit" id="login-btn">Sign in</button>
      </form>

      <p class="login-hint">Admin accounts are created by the store owner. Never share admin credentials.</p>

      <a class="login-back" href="/">&larr; Back to storefront</a>
    </section>
  </main>
  <script src="/splash.js?v=__ASSET_VERSION__"></script>
  <script src="/admin-login.js?v=__ASSET_VERSION__"></script>
</body>
</html>
