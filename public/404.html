<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Page not found - Aamart</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/splash.css?v=__ASSET_VERSION__">
</head>
<body>
  <div class="site-splash" id="site-splash" role="status" aria-label="Loading Aamart">
    <div class="site-splash__aura" aria-hidden="true"></div>
    <div class="site-splash__content">
      <div class="site-splash__logo" aria-hidden="true">A</div>
      <div class="site-splash__word" aria-hidden="true"><span>A</span><span>a</span><span>m</span><span>a</span><span>r</span><span>t</span></div>
      <div class="site-splash__track" aria-hidden="true"><span></span></div>
      <p class="site-splash__tag">Shop smart. Live better.</p>
    </div>
  </div>

  <main class="app">
    <div class="page-head"><h1>Page not found</h1></div>
    <div class="empty">
      <div class="e-icon">&#128269;</div>
      <h3>We couldn't find that page</h3>
      <p>The link may be broken or the page may have moved.</p>
      <a class="btn" href="/">Go to Home</a>
    </div>
  </main>
  <script src="/splash.js?v=__ASSET_VERSION__"></script>
</body>
</html>
