<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin · Aamart</title>
  <link rel="stylesheet" href="/admin.css">
</head>
<body class="admin-page">
  <div class="admin-shell" id="admin-shell" hidden>
    <aside class="sidebar" id="sidebar" aria-label="Admin navigation">
      <div class="sidebar-brand">
        <span class="brand-mark" aria-hidden="true">A</span>
        <div>
          <strong>Aamart</strong>
          <small id="role-label">Admin panel</small>
        </div>
      </div>
      <nav class="sidebar-nav" id="nav"></nav>
      <div class="sidebar-foot">
        <a class="side-link" href="/" target="_blank" rel="noopener">View storefront &nearr;</a>
        <button class="side-link danger" type="button" data-action="logout">Sign out</button>
      </div>
    </aside>
    <div class="sidebar-scrim" id="sidebar-scrim" hidden></div>

    <div class="admin-main">
      <header class="topbar">
        <button class="icon-btn" type="button" id="menu-btn" aria-label="Open menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <div class="topbar-title">
          <h1 id="page-title">Dashboard</h1>
          <p id="page-sub"></p>
        </div>
        <div class="topbar-right">
          <span class="admin-chip" id="admin-chip"></span>
        </div>
      </header>
      <main class="view" id="view" tabindex="-1">
        <div class="loading"><span class="spinner"></span> Loading&hellip;</div>
      </main>
    </div>
  </div>

  <div class="boot" id="boot"><span class="spinner"></span> Checking session&hellip;</div>
  <div class="toast-root" id="toast-root" aria-live="polite"></div>
  <div id="modal-root"></div>

  <script src="/admin.js"></script>
</body>
</html>
